# Konfigurasi `flutter gen-l10n`: satu file ARB per bahasa di `lib/l10n`,
# hasil generate masuk ke `lib/l10n/generated` (bukan synthetic package) agar
# import stabil dan ikut ter-analisis.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
nullable-getter: false
